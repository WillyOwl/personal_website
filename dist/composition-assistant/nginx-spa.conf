# Nginx configuration for AI Composition Assistant SPA
# Place this in your nginx server block or sites-available configuration

location /composition-assistant/ {
    alias /var/www/willyzuo.net/composition-assistant/;
    
    # Try to serve files directly, then fallback to index.html for SPA routing
    try_files $uri $uri/ /composition-assistant/index.html;
    
    # Handle index files
    index index.html;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# API proxy (if backend is running)
location /composition-assistant/api/ {
    proxy_pass http://localhost:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Handle CORS if needed
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
}

# Static file caching
location ~* /composition-assistant/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    alias /var/www/willyzuo.net/composition-assistant/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
